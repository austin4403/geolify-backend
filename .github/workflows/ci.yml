name: CI & Quality Gates

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Lint, Build & Security Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔨 Compile TypeScript (Typecheck & Build)
        run: npm run build

      - name: 🧪 Run Automated Integration & Security Pen-Tests
        run: npm test
        env:
          NODE_ENV: test
          PORT: 5001
          DATABASE_URL: postgresql://mock_user:mock_pass@localhost:5432/geoquerry_mock

      - name: 🐳 Validate Multi-Stage Docker Image Build
        run: docker build -t geoquerry-backend:test .
